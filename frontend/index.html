<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Institute App</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand"><span class="dot"></span>Institute App</div>
      <p class="tagline">Log in to your coding classroom</p>

      <div id="login-success" class="login-success"></div>
      <div id="login-error" class="login-error"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@institute.edu" required autofocus />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>

      <p class="login-switch">New student? <a href="signup.html">Create an account</a></p>

      <!-- the demo accounts exist only in a local database seeded by scripts/init_db.py -->
      <div class="login-hint" id="demo-hint" hidden>
        <strong>Demo accounts</strong><br />
        Instructor — anita@institute.edu / instructor123<br />
        Student — ravi@institute.edu / student123
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
