<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks — Institute App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="brand"><span class="dot"></span>Institute App</div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
      </nav>
      <div class="userbox">
        <span id="batch-name-label"></span>
        <span class="avatar" id="user-avatar"></span>
        <span id="user-name"></span>
        <button class="btn-logout" onclick="logout()">Log out</button>
      </div>
    </div>

    <div class="page">
      <div class="page-header">
        <div>
          <a href="dashboard.html" class="back-link"><i class="ti ti-arrow-left"></i> Dashboard</a>
          <h1 id="page-title">My Tasks</h1>
          <p class="subtitle" id="batch-subtitle">Loading your batch…</p>
        </div>
        <div class="tasks-header-count" id="task-count"></div>
      </div>

      <div id="task-list"></div>

      <div id="empty-state" class="empty-state card" style="display:none; padding: 22px;">
        <div class="icon"><i class="ti ti-inbox"></i></div>
        <div><strong>No tasks assigned yet.</strong></div>
        <div class="small-muted">Once your instructor assigns work to your batch, it will show up here.</div>
      </div>

      <div class="tasks-footer-note" id="footer-note">
        <i class="ti ti-info-circle"></i>
        Video, Worksheet, Interactive, Daily Task, and Reading tasks will appear here once your instructor starts assigning them.
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/worksheet-viewer.js"></script>
  <script src="../js/student/tasks.js"></script>
</body>
</html>
