<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — Institute App</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand"><span class="dot"></span>Institute App</div>
      <p class="tagline">Create your student account</p>

      <div id="signup-error" class="login-error"></div>

      <form id="signup-form">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" maxlength="100" autocomplete="name" required autofocus />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" maxlength="254" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" required />
          <div class="hint">At least 8 characters.</div>
        </div>
        <div class="field">
          <label for="password2">Confirm password</label>
          <input type="password" id="password2" name="password2" minlength="8" maxlength="128" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn btn-primary">Create account</button>
      </form>

      <p class="login-switch">Already have an account? <a href="index.html">Log in</a></p>
      <p class="login-hint">After signing up, your instructor adds you to your batch — your tasks appear once they do.</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
